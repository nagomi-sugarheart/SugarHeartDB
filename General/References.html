<body>
<script src="components/header.js"></script>

<section class="page-hero">
    <div class="breadcrumb"><a href="/SugarHeartDB/">HOME</a> · <strong>参考・情報提供</strong></div>
    <h1>参考・情報提供 <span class="sub">/ CREDITS</span></h1>
</section>

<div class="page">

    <section class="news ref-section">
        <div class="sh-section-head">
            <h2>参考</h2>
        </div>
        <ul class="ref-list" id="references-list">
            <li class="placeholder-text">読み込み中…</li>
        </ul>
    </section>

    <section class="news ref-section">
        <div class="sh-section-head">
            <h2>情報提供</h2>
        </div>
        <ul class="ref-list" id="providers-list">
            <li class="placeholder-text">読み込み中…</li>
        </ul>
    </section>

</div>

<script>
(function() {
    function renderList(items, containerId) {
        var container = document.getElementById(containerId);
        if (!items || items.length === 0) {
            container.innerHTML = '<li class="placeholder-text">データがありません。</li>';
            return;
        }
        container.innerHTML = '';
        items.forEach(function(item) {
            var li = document.createElement('li');
            li.className = 'ref-item';
            var a = document.createElement('a');
            a.href = item.url;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            a.textContent = item.name;
            li.appendChild(a);
            if (item.note) {
                var note = document.createElement('div');
                note.className = 'ref-note';
                note.textContent = item.note;
                li.appendChild(note);
            }
            container.appendChild(li);
        });
    }

    fetch('data/references.json')
        .then(function(r) { return r.json(); })
        .then(function(data) {
            renderList(data.references, 'references-list');
            renderList(data.providers, 'providers-list');
        })
        .catch(function() {
            var msg = '<li class="placeholder-text">データを読み込めませんでした。</li>';
            document.getElementById('references-list').innerHTML = msg;
            document.getElementById('providers-list').innerHTML = msg;
        });
})();
</script>

</body>
</html>
