    /* === ユーティリティ === */
    function esc(s) {
        return String(s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function typeTag(type) {
        if (type === 'CAST') return '<span class="sh-tag sh-tag-sm" data-tag="cast">キャストLIVE</span>';
        if (type === 'XR')   return '<span class="sh-tag sh-tag-sm" data-tag="xr">XR LIVE</span>';
        return '';
    }

    /* === 公演から見る === */
    function renderConcerts(filter) {
        var root = document.getElementById('ll-concerts');
        var lives = filter === 'all' ? LIVES : LIVES.filter(function (l) { return l.type === filter; });

        if (lives.length === 0) {
            root.innerHTML = '<p class="placeholder-text" style="padding:20px 0">該当する公演はありません</p>';
            return;
        }

        root.innerHTML = lives.map(function (live) {
            var parts = live.date.split('-');
            var y = parts[0], m = parts[1], d = parts[2];
            var tracks = live.songs.map(function (s) {
                return '<div class="ll-track">' +
                    '<span class="ll-track-num">' + esc(s.num) + '</span>' +
                    '<span class="ll-track-title">' + esc(s.title) + '</span>' +
                    '<span class="ll-track-with">' + esc(s.with) + '</span>' +
                    '</div>';
            }).join('');

            return '<details class="ll-concert-card" data-type="' + live.type + '">' +
                '<summary class="ll-concert-head">' +
                '<div class="ll-date"><span class="ll-y">' + y + '</span><span class="ll-md">' + m + '/' + d + '</span></div>' +
                typeTag(live.type) +
                '<span class="ll-event-name">' + esc(live.event) + '</span>' +
                '<span class="ll-song-count">' + live.songs.length + '曲</span>' +
                '</summary>' +
                '<div class="ll-setlist">' + tracks + '</div>' +
                '</details>';
        }).join('');
    }

    /* === 歌唱曲から見る：ユニーク曲リスト構築 === */
    function buildSongMap(filter) {
        var lives = filter === 'all' ? LIVES : LIVES.filter(function (l) { return l.type === filter; });
        var map = [];
        var seen = {};

        lives.forEach(function (live) {
            live.songs.forEach(function (s) {
                var key = s.title;
                if (!seen[key]) {
                    seen[key] = { title: s.title, types: [], perfs: [] };
                    map.push(seen[key]);
                }
                var entry = seen[key];
                if (entry.types.indexOf(live.type) < 0) entry.types.push(live.type);
                entry.perfs.push({ date: live.date, event: live.event, num: s.num, with: s.with, type: live.type });
            });
        });

        return map;
    }

    /* === 歌唱曲から見る === */
    function renderSongs(filter) {
        var root = document.getElementById('ll-songs');
        var songs = buildSongMap(filter);

        if (songs.length === 0) {
            root.innerHTML = '<p class="placeholder-text" style="padding:20px 0">該当する曲はありません</p>';
            return;
        }

        root.innerHTML = songs.map(function (song) {
            var typeTags = song.types.map(typeTag).join('');
            var perfs = song.perfs.map(function (p) {
                var parts = p.date.split('-');
                return '<div class="ll-perf-row">' +
                    '<span class="ll-date-sm">' + parts[0] + '/' + parts[1] + '/' + parts[2] + '</span>' +
                    typeTag(p.type) +
                    '<span class="ll-perf-num">' + esc(p.num) + '</span>' +
                    '<span class="ll-perf-event">' + esc(p.event) + '</span>' +
                    '<span class="ll-perf-with">' + esc(p.with) + '</span>' +
                    '</div>';
            }).join('');

            return '<details class="ll-song-card">' +
                '<summary class="ll-song-head">' +
                typeTags +
                '<span class="ll-song-title">' + esc(song.title) + '</span>' +
                '<span class="ll-song-count">' + song.perfs.length + '公演</span>' +
                '</summary>' +
                '<div class="ll-perf-list">' + perfs + '</div>' +
                '</details>';
        }).join('');
    }

    /* === フィルター切り替え === */
    window.llFilter = function (btn, filter) {
        document.querySelectorAll('#ll-filter-row .filter-chip').forEach(function (b) {
            b.classList.remove('active');
        });
        btn.classList.add('active');
        renderConcerts(filter);
        renderSongs(filter);
    };

    /* === 初期描画 === */
    renderConcerts('all');
    renderSongs('all');
}());
</script>
</body>
</html>
