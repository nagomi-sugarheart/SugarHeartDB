(function () {
    var currentFilter = 'all';

    function catGroup(cat) {
        if (cat === 'ds-event' || cat === 'ds-card') return 'ds';
        if (cat === 'mb-event' || cat === 'mb-card') return 'mb';
        if (cat === 'collab') return 'collab';
        if (cat === 'live')   return 'live';
        if (cat === 'cd')     return 'cd';
        return 'unit';
    }

    function pad2(n) { return n < 10 ? '0' + n : '' + n; }

    function render(filter) {
        var body = document.getElementById('tl-body');
        body.innerHTML = '';

        var filtered = filter === 'all'
            ? TL.slice()
            : TL.filter(function (e) { return catGroup(e.cat) === filter; });

        /* 新しい順（降順） */
        filtered.sort(function (a, b) {
            return b.date.localeCompare(a.date);
        });

        document.getElementById('tl-count').textContent = filtered.length;

        if (filtered.length === 0) {
            body.innerHTML = '<p style="color:var(--sh-text-mute);padding:20px 0;">該当するデータがありません。</p>';
            return;
        }

        /* 年でグループ化 */
        var byYear = {};
        var years = [];
        filtered.forEach(function (e) {
            var y = e.date.slice(0, 4);
            if (!byYear[y]) { byYear[y] = []; years.push(y); }
            byYear[y].push(e);
        });
        years.sort(function (a, b) { return b - a; });

        years.forEach(function (y) {
            var items = byYear[y];

            var grp = document.createElement('div');
            grp.className = 'tl-year-group';

            var band = document.createElement('div');
            band.className = 'tl-year-band';
            band.innerHTML =
                '<div class="tl-year-num">' + y + '</div>' +
                '<div class="tl-year-count">' + items.length + ' items</div>' +
                '<div class="tl-year-line"></div>';
            grp.appendChild(band);

            items.forEach(function (e) {
                var parts = e.date.split('-');
                var mm = parts[1];
                var dd = parts[2];

                var a = document.createElement('a');
                a.className = 'tl-row';
                a.href = e.link;
                a.setAttribute('data-cat', e.cat);
                a.innerHTML =
                    '<div class="tl-date"><div class="md">' + mm + '/' + dd + '</div></div>' +
                    '<div class="tl-title">' + e.title + '</div>' +
                    '<span class="tl-tag" data-cat="' + e.cat + '">' + e.label + '</span>';
                grp.appendChild(a);
            });

            body.appendChild(grp);
        });
    }

    /* フィルターボタン */
    document.querySelectorAll('.tl-filter-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
            currentFilter = this.dataset.filter;
            document.querySelectorAll('.tl-filter-btn').forEach(function (b) { b.classList.remove('active'); });
            this.classList.add('active');
            render(currentFilter);
        });
    });

    render('all');
})();
</script>

</body>
</html>
