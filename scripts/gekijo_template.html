    <link rel="icon" type="image/png" sizes="32x32" href="https://res.cloudinary.com/dnmzdghoi/image/upload/f_auto,q_auto/Favicon/favicon-32x32">

</head>
<body>
<script src="components/header.js"></script>

<section class="page-hero">
    <div class="breadcrumb"><a href="/SugarHeartDB/">HOME</a> · <strong>シンデレラガールズ劇場</strong></div>
    <h1>シンデレラガールズ劇場 <span class="sub">/ CINDERELLA GIRLS GEKIJO</span></h1>
</section>

<div class="page">

    <div class="toolbar">
        <div class="filters" id="gekijo-filters">
            <button class="filter-chip active" data-type="">すべて</button>
            <button class="filter-chip" data-type="mujirushi">無印</button>
            <button class="filter-chip" data-type="wide">わいど☆</button>
            <button class="filter-chip" data-type="anime">アニメ</button>
        </div>
    </div>

    <p style="font-size: 0.82rem; color: var(--sh-text-mute); margin-bottom: 12px; font-family: monospace;">
        <span id="gekijo-count">{{TOTAL}}</span>話 表示中
    </p>

    <div class="gekijo-list" id="gekijo-list">
{{BLOCKS}}
    </div>
    <p id="gekijo-empty" class="list-empty" style="display:none;">この区分はまだ準備中です。</p>

</div>

<div class="sh-lightbox" id="sh-lightbox">
    <span class="sh-lightbox-close" id="sh-lightbox-close">×</span>
    <img class="sh-lightbox-img" id="sh-lightbox-img" src="" alt="">
</div>

<script src="components/common.js"></script>
<script>
(function () {
    'use strict';
    var VALID = { 'mujirushi': 1, 'wide': 1, 'anime': 1 };
    function apply(type) {
        var blocks = document.querySelectorAll('.gekijo-block');
        var shown = 0;
        blocks.forEach(function (b) {
            var hit = !type || b.dataset.type === type;
            b.style.display = hit ? '' : 'none';
            if (hit) shown++;
        });
        document.getElementById('gekijo-count').textContent = shown;
        document.getElementById('gekijo-empty').style.display = shown ? 'none' : '';
        document.querySelectorAll('#gekijo-filters .filter-chip').forEach(function (c) {
            c.classList.toggle('active', (c.dataset.type || '') === (type || ''));
        });
    }
    document.querySelectorAll('#gekijo-filters .filter-chip').forEach(function (chip) {
        chip.addEventListener('click', function () {
            var ty = chip.dataset.type || '';
            apply(ty);
            if (history.replaceState) history.replaceState(null, '', ty ? '#' + ty : '#');
        });
    });
    var h = location.hash.replace('#', '');
    apply(VALID[h] ? h : '');
})();
</script>
</body>
</html>
